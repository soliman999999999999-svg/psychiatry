function saveCategoryLabels() {
  document.querySelectorAll(".category-edit-input").forEach(input => {
    const id = input.dataset.category;
    const value = input.value.trim().slice(0, 24);
    const defaultLabel = FLAG_CATEGORIES.find(c => c.id === id).label;
    if (value && value !== defaultLabel) state.categoryLabels[id] = value;
    else delete state.categoryLabels[id];
  });
  state.categoryEditorOpen = false;
  render();
  scheduleSave();
}
function resetCategoryLabels() {
  state.categoryLabels = {};
  state.categoryEditorOpen = false;
  render();
  scheduleSave();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startReview(type, category) {
  let ids;
  if (type === "flagged") {
    ids = QUESTIONS.filter(q => {
      if (!state.marked.has(q.id)) return false;
      if (category) return (state.markedCategory[q.id] || "review") === category;
      return true;
    }).map(q => q.id);
  } else {
    ids = QUESTIONS.filter(q => state.submitted.has(q.id) && state.answers[q.id] !== q.answer).map(q => q.id);
  }
  if (ids.length === 0) return;
  const queue = shuffle(ids);
  if (type !== "flagged") {
    // reset incorrect questions so they can be re-attempted fresh; flagged questions are left as-is
    queue.forEach(id => {
      state.submitted.delete(id);
      delete state.answers[id];
    });
  }
  state.reviewQueue = queue;
  state.reviewType = type;
  state.reviewCategory = type === "flagged" ? (category || null) : null;
  state.view = "quiz";
  jump(queue[0], { keepReview: true });
}

function exitReview() {
  state.reviewQueue = null;
  state.reviewType = null;
  state.reviewCategory = null;
  render();
}

function goPrev() {
  if (state.reviewQueue) {
    let i = state.reviewQueue.indexOf(state.currentId) - 1;
    while (i > 0 && REPEATED_IDS.has(state.reviewQueue[i])) i--;
    if (i >= 0) jump(state.reviewQueue[i], { keepReview: true });
    return;
  }
  let i = getCurrentIndex() - 1;
  while (i > 0 && REPEATED_IDS.has(QUESTIONS[i].id)) i--;
  if (i >= 0) jump(QUESTIONS[i].id);
}
function goNext() {
  if (state.reviewQueue) {
    let i = state.reviewQueue.indexOf(state.currentId) + 1;
    while (i < state.reviewQueue.length - 1 && REPEATED_IDS.has(state.reviewQueue[i])) i++;
    if (i < state.reviewQueue.length) jump(state.reviewQueue[i], { keepReview: true });
    return;
  }
  let i = getCurrentIndex() + 1;
  while (i < QUESTIONS.length - 1 && REPEATED_IDS.has(QUESTIONS[i].id)) i++;
  if (i < QUESTIONS.length) jump(QUESTIONS[i].id);
}
function setView(v) { state.view = v; state.flagMenuOpen = false; render(); }
function setSidebarOpen(v) { state.sidebarOpen = v; render(); }

/* ---------- Render: Sidebar ---------- */
function renderSidebar() {
  const stats = overallStats();
  const byTopic = questionsByTopic();

  let topicsHtml = "";
  for (const topic of TOPICS) {
    const qs = byTopic[topic];
    const isOpen = state.expanded.has(topic);
    const answeredCount = qs.filter(q => state.submitted.has(q.id)).length;
    const correctCount = qs.filter(q => state.submitted.has(q.id) && state.answers[q.id] === q.answer).length;

    let gridHtml = "";
    if (isOpen) {
      gridHtml = `<div class="qnav-grid">` + qs.map(q => {
        const status = statusOf(q);
        const isCurrent = q.id === state.currentId;
        const isRepeat = REPEATED_IDS.has(q.id);
        const isFlagged = state.marked.has(q.id);
        const cat = isFlagged ? flagCategoryInfo(state.markedCategory[q.id]) : null;
        const cls = ["qnav-btn"];
        if (status === "correct") cls.push("correct");
        if (status === "incorrect") cls.push("incorrect");
        if (isCurrent) cls.push("current");
        const title = `Question ${q.number}${isFlagged ? ` — flagged (${cat.label})` : ""}${isRepeat ? " — repeats an earlier question" : ""}`;
        const flagDot = isFlagged ? `<span class="qnav-flag" style="background:${cat.color};"></span>` : "";
        return `<button class="${cls.join(" ")}" title="${title}" data-action="jump" data-id="${q.id}">${q.number}${flagDot}${isRepeat ? '<span class="qnav-repeat"></span>' : ""}</button>`;
      }).join("") + `</div>`;
    }

    topicsHtml += `
      <div class="topic-block">
        <button class="topic-header" data-action="toggle-expand" data-topic-index="${TOPICS.indexOf(topic)}">
          <span class="topic-header-name">${isOpen ? ICONS.chevronDown : ICONS.chevronRight} ${esc(topic)}</span>
          <span class="topic-header-stat">${correctCount}/${answeredCount}/${qs.length}</span>
        </button>
        ${gridHtml}
      </div>`;
  }

  return `
    <aside class="sidebar${state.sidebarOpen ? " open" : ""}">
      <div class="sidebar-head">
        <div class="sidebar-head-row">
          <div class="sidebar-title">PSYCHIATRY</div>
          <button class="mobile-close" data-action="sidebar-close">${ICONS.xClose}</button>
        </div>
        ${ICONS.ecg}
        <div class="sidebar-stats">${stats.answered}/${stats.total} answered &middot; ${stats.correct} correct</div>
        <div class="sidebar-legend">
          ${FLAG_CATEGORIES.map(c => `<span><span class="legend-dot" style="background:${c.color};"></span>${esc(flagCategoryInfo(c.id).label)}</span>`).join("")}
          <span><span class="legend-dot legend-repeat"></span>repeat</span>
          <button class="legend-edit-btn" data-action="open-category-editor" title="Rename flag categories">${ICONS.pencil}</button>
        </div>
      </div>
      <button class="summary-btn${state.view === "summary" ? " active" : ""}" data-action="set-view" data-view="${state.view === "summary" ? "quiz" : "summary"}">
        ${ICONS.bar} Performance summary
      </button>
      <div class="topic-list">${topicsHtml}</div>
      <div class="sidebar-footer">
        <button class="clear-progress-btn" data-action="clear-progress">${ICONS.trash} Clear progress</button>
      </div>
    </aside>`;
}

/* ---------- Render: Option row ---------- */
function renderOption(opt, current, isSubmitted) {
  const selected = state.answers[current.id];
  let state_ = "idle";
  if (isSubmitted) {
    if (opt.letter === current.answer) state_ = "correct";
    else if (opt.letter === selected) state_ = "incorrect";
    else state_ = "muted";
  } else if (opt.letter === selected) {
    state_ = "selected";
  }
  const rowCls = ["option-row"];
  if (state_ !== "idle") rowCls.push(state_);
  if (isSubmitted) rowCls.push("disabled");
  const badgeCls = ["option-badge"];
  if (state_ !== "idle") badgeCls.push(state_);
  const inner = (isSubmitted && state_ === "correct") ? ICONS.check(14, "#fff") : opt.letter;
  return `
    <button class="${rowCls.join(" ")}" data-action="select-option" data-letter="${opt.letter}" ${isSubmitted ? "disabled" : ""}>
      <span class="${badgeCls.join(" ")}">${inner}</span>
      <span class="option-text" data-hl-key="${current.id}__opt_${opt.letter}">${renderHighlighted(opt.text, current.id + "__opt_" + opt.letter)}</span>
    </button>`;
}

/* ---------- Render: Quiz main ---------- */
function renderQuizMain() {
  const current = getCurrent();
  const isSubmitted = state.submitted.has(current.id);
  const selected = state.answers[current.id];

  const optionsHtml = current.options.map(o => renderOption(o, current, isSubmitted)).join("");

  let actionHtml;
  if (!isSubmitted) {
    actionHtml = `<button class="submit-btn${selected ? " enabled" : ""}" data-action="submit">Submit answer</button>`;
  } else {
    actionHtml = "";
  }

  let isFirst, isLast, reviewBannerHtml = "";
  if (state.reviewQueue) {
    const ri = state.reviewQueue.indexOf(current.id);
    isFirst = ri <= 0;
    isLast = ri >= state.reviewQueue.length - 1;
    let bannerLabel = "Reviewing incorrect answers";
    if (state.reviewType === "flagged") {
      bannerLabel = state.reviewCategory
        ? `Reviewing "${esc(flagCategoryInfo(state.reviewCategory).label)}" flagged questions`
        : "Reviewing flagged questions";
    }
    reviewBannerHtml = `
      <div class="review-banner">
        <span>${ICONS.shuffle} ${bannerLabel} — ${ri + 1} of ${state.reviewQueue.length}</span>
        <button class="review-exit-btn" data-action="exit-review">Exit review</button>
      </div>`;
  } else {
    const idx = getCurrentIndex();
    isFirst = idx === 0;
    isLast = idx === QUESTIONS.length - 1;
  }

  return `
    <div class="q-wrap">
      ${reviewBannerHtml}
      <div class="q-eyebrow">Question ${current.number}</div>
      <p class="q-stem" data-hl-key="${current.id}__stem">${renderHighlighted(current.stem, current.id + "__stem")}</p>
      <div class="options">${optionsHtml}</div>
      ${actionHtml}
      <div class="nav-row">
        <button class="nav-btn" data-action="prev" ${isFirst ? "disabled" : ""}>${ICONS.chevronLeft16} Previous</button>
        <button class="nav-btn primary" data-action="next" ${isLast ? "disabled" : ""}>Next ${ICONS.chevronRight16}</button>
      </div>
    </div>`;
}

/* ---------- Render: Summary ---------- */
function renderSummary() {
  const byTopic = questionsByTopic();
  const allQ = QUESTIONS;
  const answeredQ = allQ.filter(q => state.submitted.has(q.id));
  const correctQ = answeredQ.filter(q => state.answers[q.id] === q.answer);
  const pct = answeredQ.length ? Math.round((correctQ.length / answeredQ.length) * 100) : 0;

  let barsHtml = "";
  for (const topic of TOPICS) {
    const qs = byTopic[topic];
    const ans = qs.filter(q => state.submitted.has(q.id));
    const cor = ans.filter(q => state.answers[q.id] === q.answer);
    const p = ans.length ? Math.round((cor.length / ans.length) * 100) : null;
    const correctPct = ans.length ? (cor.length / qs.length) * 100 : 0;
    const incorrectPct = ans.length ? ((ans.length - cor.length) / qs.length) * 100 : 0;
    barsHtml += `
      <div>
        <div class="topic-bar-label">
          <span>${esc(topic)}</span>
          <span class="stat">${ans.length ? `${cor.length}/${ans.length} (${p}%)` : `0/${qs.length}`}</span>
        </div>
        <div class="topic-bar-track">
          <div class="topic-bar-fill" style="width:${correctPct}%;background:#1F9D55;"></div>
          <div class="topic-bar-fill" style="width:${incorrectPct}%;background:#D64545;"></div>
        </div>
      </div>`;
  }

  let flagsHtml = "";
  if (state.marked.size > 0) {
    const groupsHtml = FLAG_CATEGORIES.map(cat => {
      const qs = allQ.filter(q => state.marked.has(q.id) && (state.markedCategory[q.id] || "review") === cat.id);
      if (qs.length === 0) return "";
      const label = flagCategoryInfo(cat.id).label;
      const chips = qs.map(q =>
        `<button class="flag-chip" style="border-color:${cat.color};color:${cat.color};background:${cat.bg};" data-action="jump-and-quiz" data-id="${q.id}">Q${q.number}</button>`
      ).join("");
      return `
        <div class="flag-group">
          <div class="flag-group-label">
            <span class="flag-menu-dot" style="background:${cat.color};"></span>${esc(label)} (${qs.length})
            <button class="flag-group-review-btn" style="color:${cat.color};" data-action="start-review" data-review-type="flagged" data-review-category="${cat.id}">${ICONS.shuffle} Review</button>
          </div>
          <div class="flag-chips">${chips}</div>
        </div>`;
    }).join("");
    flagsHtml = `
      <h2 class="summary-h2">Flagged for review</h2>
      <button class="retry-btn flag-retry-btn" data-action="start-review" data-review-type="flagged">${ICONS.shuffle} Review ${state.marked.size} flagged question${state.marked.size === 1 ? "" : "s"} (random order)</button>
      ${groupsHtml}`;
  }

  return `
    <div class="summary-wrap">
      <h1 class="summary-h1">Performance summary</h1>
      <p class="summary-sub">${answeredQ.length} of ${allQ.length} questions answered</p>
      <div class="stat-row">
        <div class="stat-card dark"><div class="stat-num teal">${pct}%</div><div class="stat-label">overall accuracy</div></div>
        <div class="stat-card green"><div class="stat-num green">${correctQ.length}</div><div class="stat-label">correct</div></div>
        <div class="stat-card red"><div class="stat-num red">${answeredQ.length - correctQ.length}</div><div class="stat-label">incorrect</div></div>
      </div>
      ${(answeredQ.length - correctQ.length) > 0
        ? `<button class="retry-btn" data-action="start-review" data-review-type="incorrect">${ICONS.shuffle} Retry ${answeredQ.length - correctQ.length} incorrect question${(answeredQ.length - correctQ.length) === 1 ? "" : "s"} (random order)</button>`
        : `<div class="retry-empty">No incorrect answers to retry yet — nice work so far.</div>`}
      <h2 class="summary-h2">By topic</h2>
      <div class="topic-bars">${barsHtml}</div>
      ${flagsHtml}
    </div>`;
}

/* ---------- Render: Topbar ---------- */
function renderTopbar() {
  const current = getCurrent();
  const idx = getCurrentIndex();
  const leftHtml = state.view === "quiz"
    ? `<div class="topbar-info"><b>Item ${idx + 1}</b><span class="of"> / ${QUESTIONS.length}</span><span class="topbar-sep">|</span>${esc(current.topic)}</div>`
    : `<div class="summary-title">Summary</div>`;

  let flagHtml = "";
  if (state.view === "quiz") {
    const isFlagged = state.marked.has(current.id);
    const cat = isFlagged ? flagCategoryInfo(state.markedCategory[current.id]) : null;
    const btnStyle = isFlagged ? `style="background:${cat.bg};border-color:${cat.color};color:${cat.color};"` : "";
    const label = isFlagged ? cat.label : "Flag";
    const menuHtml = state.flagMenuOpen ? `
      <div class="flag-menu">
        ${FLAG_CATEGORIES.map(c => `
          <button class="flag-menu-item" data-action="set-flag-category" data-category="${c.id}">
            <span class="flag-menu-dot" style="background:${c.color};"></span>${esc(flagCategoryInfo(c.id).label)}
          </button>`).join("")}
        ${isFlagged ? `<button class="flag-menu-item flag-menu-remove" data-action="remove-flag">${ICONS.xClose} Remove flag</button>` : ""}
        <button class="flag-menu-item flag-menu-rename" data-action="open-category-editor">${ICONS.pencil} Rename categories</button>
      </div>` : "";
    flagHtml = `
      <div class="flag-wrap">
        <button class="flag-btn${isFlagged ? " active" : ""}" ${btnStyle} data-action="toggle-flag-menu">
          ${ICONS.flag(isFlagged)} ${label}
        </button>
        ${menuHtml}
      </div>`;
  }

  return `
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" data-action="sidebar-open">${ICONS.menu}</button>
        ${leftHtml}
      </div>
      <div>${flagHtml}</div>
    </div>`;
}

/* ---------- Full render ---------- */
let scrollContentToTop = false;

function renderCategoryEditor() {
  if (!state.categoryEditorOpen) return "";
  const rows = FLAG_CATEGORIES.map(c => `
    <div class="category-edit-row">
      <span class="category-edit-dot" style="background:${c.color};"></span>
      <input class="category-edit-input" data-category="${c.id}" value="${esc(flagCategoryInfo(c.id).label)}" maxlength="24" placeholder="${esc(c.label)}">
    </div>`).join("");
  return `
    <div class="modal-scrim" data-action="close-category-editor"></div>
    <div class="category-editor">
      <h3>Rename flag categories</h3>
      ${rows}
      <div class="category-editor-actions">
        <button class="category-reset-btn" data-action="reset-category-labels">Reset to defaults</button>
        <div class="category-editor-buttons">
          <button class="category-cancel-btn" data-action="close-category-editor">Cancel</button>
          <button class="category-save-btn" data-action="save-category-labels">Save</button>
        </div>
      </div>
    </div>`;
}

function render() {
  hideHlToolbar();

  // Preserve the sidebar's scroll position — otherwise re-rendering resets it to the top
  const prevTopicList = document.querySelector(".topic-list");
  const prevSidebarScroll = prevTopicList ? prevTopicList.scrollTop : 0;

  const idx = getCurrentIndex();
  const progressPct = ((idx + 1) / QUESTIONS.length) * 100;

  const progressHtml = state.view === "quiz"
    ? `<div class="progress-track"><div class="progress-fill" style="width:${progressPct}%;"></div></div>`
    : "";

  const contentHtml = state.view === "summary" ? renderSummary() : renderQuizMain();

  document.getElementById("app").innerHTML = `
    <div class="scrim${state.sidebarOpen ? " open" : ""}" data-action="sidebar-close"></div>
    ${renderSidebar()}
    <div class="main-col">
      ${renderTopbar()}
      ${progressHtml}
      <div class="content-scroll" id="content-scroll">${contentHtml}</div>
    </div>
    ${renderCategoryEditor()}`;

  const newTopicList = document.querySelector(".topic-list");
  if (newTopicList) newTopicList.scrollTop = prevSidebarScroll;

  const scrollEl = document.getElementById("content-scroll");
  if (scrollEl && scrollContentToTop) scrollEl.scrollTo({ top: 0, behavior: "smooth" });
  scrollContentToTop = false;
}

/* ---------- Delegated click handling (avoids inline-onclick quoting bugs) ---------- */
document.getElementById("app").addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const action = el.dataset.action;
  if (action === "jump") jump(Number(el.dataset.id));
  else if (action === "jump-and-quiz") { jump(Number(el.dataset.id)); setView("quiz"); }
  else if (action === "toggle-expand") toggleExpand(TOPICS[Number(el.dataset.topicIndex)]);
  else if (action === "sidebar-close") setSidebarOpen(false);
  else if (action === "sidebar-open") setSidebarOpen(true);
  else if (action === "set-view") setView(el.dataset.view);
  else if (action === "select-option") {
    if (window.getSelection().toString().length > 0) return; // was highlighting text, not choosing an answer
    selectOption(el.dataset.letter);
  }
  else if (action === "submit") submitAnswer();
  else if (action === "prev") goPrev();
  else if (action === "next") goNext();
  else if (action === "toggle-flag-menu") { e.stopPropagation(); toggleFlagMenu(); }
  else if (action === "set-flag-category") setFlagCategory(el.dataset.category);
  else if (action === "remove-flag") removeFlag();
  else if (action === "remove-highlight") {
    removeHighlight(el.dataset.hkey, Number(el.dataset.start), Number(el.dataset.end));
    render();
    scheduleSave();
  }
  else if (action === "clear-progress") clearProgress();
  else if (action === "start-review") startReview(el.dataset.reviewType, el.dataset.reviewCategory);
  else if (action === "exit-review") exitReview();
  else if (action === "open-category-editor") openCategoryEditor();
  else if (action === "close-category-editor") closeCategoryEditor();
  else if (action === "save-category-labels") saveCategoryLabels();
  else if (action === "reset-category-labels") resetCategoryLabels();
});

// Close the flag-category menu when clicking anywhere outside it
document.addEventListener("click", (e) => {
  if (!state.flagMenuOpen) return;
  if (e.target.closest(".flag-wrap")) return;
  closeFlagMenu();
});

/* ---------- Highlight color-picker toolbar ---------- */
const hlToolbar = document.createElement("div");
hlToolbar.id = "hl-toolbar";
hlToolbar.innerHTML = `
  <button class="hl-swatch" data-color="yellow" style="background:#FDE68A" title="Highlight yellow"></button>
  <button class="hl-swatch" data-color="red" style="background:#FCA5A5" title="Highlight red"></button>
  <button class="hl-swatch" data-color="blue" style="background:#93C5FD" title="Highlight blue"></button>
`;
document.body.appendChild(hlToolbar);

let pendingSelection = null;

function hideHlToolbar() {
  hlToolbar.style.display = "none";
  pendingSelection = null;
}

function showHlToolbar(rect) {
  hlToolbar.style.display = "flex";
  const toolbarW = 96, toolbarH = 36;
  let left = rect.left + rect.width / 2 - toolbarW / 2;
  let top = rect.top - toolbarH - 10;
  left = Math.max(8, Math.min(left, window.innerWidth - toolbarW - 8));
  if (top < 8) top = rect.bottom + 10; // flip below if too close to top
  hlToolbar.style.left = left + "px";
  hlToolbar.style.top = top + "px";
}

function getTextOffsets(container, range) {
  const preRange = document.createRange();
  preRange.selectNodeContents(container);
  preRange.setEnd(range.startContainer, range.startOffset);
  const start = preRange.toString().length;
  const end = start + range.toString().length;
  return { start, end };
}

function handleSelectionChange() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideHlToolbar(); return; }
  const range = sel.getRangeAt(0);
  let node = range.commonAncestorContainer;
  if (node.nodeType === 3) node = node.parentElement;
  const hlContainer = node ? node.closest("[data-hl-key]") : null;
  if (!hlContainer || !hlContainer.contains(sel.anchorNode) || !hlContainer.contains(sel.focusNode)) {
    hideHlToolbar();
    return;
  }
  const { start, end } = getTextOffsets(hlContainer, range);
  if (end <= start) { hideHlToolbar(); return; }
  pendingSelection = { key: hlContainer.dataset.hlKey, start, end };
  showHlToolbar(range.getBoundingClientRect());
}

let hlSelectionTimer = null;
document.addEventListener("selectionchange", () => {
  clearTimeout(hlSelectionTimer);
  hlSelectionTimer = setTimeout(handleSelectionChange, 120);
});

// Prevent mousedown on the toolbar from collapsing the just-made text selection
hlToolbar.addEventListener("mousedown", (e) => e.preventDefault());
hlToolbar.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-color]");
  if (!btn || !pendingSelection) return;
  addHighlight(pendingSelection.key, pendingSelection.start, pendingSelection.end, btn.dataset.color);
  window.getSelection().removeAllRanges();
  hideHlToolbar();
  render();
  scheduleSave();
});

// Hide the toolbar on scroll (its position is viewport-relative and would go stale)
window.addEventListener("scroll", hideHlToolbar, true);

/* ---------- Keyboard shortcuts ---------- */
document.addEventListener("keydown", (e) => {
  if (state.view !== "quiz") return;
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  const current = getCurrent();
  const isSubmitted = state.submitted.has(current.id);
  if (e.key === "ArrowLeft") goPrev();
  else if (e.key === "ArrowRight") goNext();
  else if (["1","2","3","4","5"].includes(e.key)) {
    const letters = ["A","B","C","D","E"];
    const optIdx = Number(e.key) - 1;
    if (current.options[optIdx] && !isSubmitted) selectOption(letters[optIdx]);
  } else if (e.key === "Enter") {
    if (!isSubmitted) submitAnswer(); else goNext();
  }
});

(async function init() {
  await loadProgress();
  render();
})();
</script>
