 modification, can prevent mental retardation?", "options": [{"letter": "A", "text": "Trisomy 21"}, {"letter": "B", "text": "Phenylketonuria"}, {"letter": "C", "text": "Fragile X syndrome"}, {"letter": "D", "text": "Tuberous sclerosis"}, {"letter": "E", "text": "Rubella infection"}], "answer": "B"}, {"id": 345, "topic": "Intellectual Disability", "number": 15, "stem": "Which inborn error of metabolism presents with hepatosplenomegaly and cataracts?", "options": [{"letter": "A", "text": "Phenylketonuria"}, {"letter": "B", "text": "Homocystinuria"}, {"letter": "C", "text": "Galactosemia"}, {"letter": "D", "text": "Hypoglycemia"}], "answer": "C"}, {"id": 346, "topic": "Intellectual Disability", "number": 16, "stem": "Which prenatal factor is strongly associated with intellectual disability?", "options": [{"letter": "A", "text": "Hypertension"}, {"letter": "B", "text": "Maternal alcohol consumption"}, {"letter": "C", "text": "Appendicitis"}, {"letter": "D", "text": "Seasonal allergy"}], "answer": "B"}, {"id": 347, "topic": "Intellectual Disability", "number": 17, "stem": "Which dietary supplement is associated with reduced risk of neural tube defects?", "options": [{"letter": "A", "text": "Vitamin B12"}, {"letter": "B", "text": "Folic acid"}, {"letter": "C", "text": "Iron"}, {"letter": "D", "text": "Vitamin D"}, {"letter": "E", "text": "Calcium"}], "answer": "B"}, {"id": 348, "topic": "Intellectual Disability", "number": 18, "stem": "Which prenatal/perinatal insult listed under \"extraordinary extrinsic influence\" can cause mental retardation?", "options": [{"letter": "A", "text": "Trisomy 21"}, {"letter": "B", "text": "Neonatal asphyxia (hypoxia)"}, {"letter": "C", "text": "Fragile X mutation"}, {"letter": "D", "text": "Galactosemia"}], "answer": "B"}, {"id": 349, "topic": "Intellectual Disability", "number": 19, "stem": "Which comorbid behavior tends to become more frequent as cognitive disability becomes more severe?", "options": [{"letter": "A", "text": "Eating disorders"}, {"letter": "B", "text": "Mood disorders"}, {"letter": "C", "text": "Self-injurious behavior and aggression"}, {"letter": "D", "text": "Anxiety disorders"}, {"letter": "E", "text": "Psychosis"}], "answer": "C"}, {"id": 350, "topic": "Intellectual Disability", "number": 20, "stem": "Which of the following is an important part of management for intellectual disability?", "options": [{"letter": "A", "text": "Long-term isolation"}, {"letter": "B", "text": "Behavioral and educational support"}, {"letter": "C", "text": "Electroconvulsive therapy"}, {"letter": "D", "text": "Antidepressant monotherapy"}], "answer": "B"}, {"id": 351, "topic": "Feeding and Eating Disorders", "number": 1, "stem": "Which factor is classified as a biological risk factor for eating disorders?", "options": [{"letter": "A", "text": "Weight stigma"}, {"letter": "B", "text": "Type 1 diabetes"}, {"letter": "C", "text": "Low self-esteem"}, {"letter": "D", "text": "Cultural body ideals"}, {"letter": "E", "text": "Historical trauma"}], "answer": "B"}, {"id": 352, "topic": "Feeding and Eating Disorders", "number": 2, "stem": "A 19-year-old woman has intense fear of gaining weight, severe food restriction, and a BMI of 16 kg/m². What is the most likely diagnosis?", "options": [{"letter": "A", "text": "Bulimia nervosa"}, {"letter": "B", "text": "Binge eating disorder"}, {"letter": "C", "text": "Anorexia nervosa"}, {"letter": "D", "text": "Avoidant personality disorder"}], "answer": "C"}, {"id": 353, "topic": "Feeding and Eating Disorders", "number": 3, "stem": "In anorexia nervosa, a BMI of 15–15.99 kg/m² is classified as which severity level?", "options": [{"letter": "A", "text": "Mild"}, {"letter": "B", "text": "Moderate"}, {"letter": "C", "text": "Severe"}, {"letter": "D", "text": "Extreme"}], "answer": "C"}, {"id": 354, "topic": "Feeding and Eating Disorders", "number": 4, "stem": "Which of the following physical Findings is commonly seen in anorexia nervosa?", "options": [{"letter": "A", "text": "Obesity"}, {"letter": "B", "text": "Lanugo hair"}, {"letter": "C", "text": "Exophthalmos"}, {"letter": "D", "text": "Hepatomegaly"}], "answer": "B"}, {"id": 355, "topic": "Feeding and Eating Disorders", "number": 5, "stem": "Which treatment approach is considered most effective for adolescent anorexia nervosa?", "options": [{"letter": "A", "text": "Individual psychodynamic therapy alone"}, {"letter": "B", "text": "Family-based therapy"}, {"letter": "C", "text": "Antipsychotic medication alone"}, {"letter": "D", "text": "Inpatient-only care"}, {"letter": "E", "text": "Group therapy exclusively"}], "answer": "B"}, {"id": 356, "topic": "Feeding and Eating Disorders", "number": 6, "stem": "Approximately what percentage of anorexia nervosa patients achieve full recovery?", "options": [{"letter": "A", "text": "10%"}, {"letter": "B", "text": "20%"}, {"letter": "C", "text": "40%"}, {"letter": "D", "text": "60%"}, {"letter": "E", "text": "80%"}], "answer": "C"}, {"id": 357, "topic": "Feeding and Eating Disorders", "number": 7, "stem": "A patient experiences recurrent binge eating episodes followed by self-induced vomiting and excessive exercise. Body weight is normal. What is the most likely diagnosis?", "options": [{"letter": "A", "text": "Anorexia nervosa"}, {"letter": "B", "text": "Bulimia nervosa"}, {"letter": "C", "text": "Binge eating disorder"}, {"letter": "D", "text": "Pica"}], "answer": "B"}, {"id": 358, "topic": "Feeding and Eating Disorders", "number": 8, "stem": "Which electrolyte abnormality is commonly associated with repeated vomiting in bulimia nervosa?", "options": [{"letter": "A", "text": "Hyperkalemia"}, {"letter": "B", "text": "Hypokalemia"}, {"letter": "C", "text": "Hypercalcemia"}, {"letter": "D", "text": "Hyponatremia"}], "answer": "B"}, {"id": 359, "topic": "Feeding and Eating Disorders", "number": 9, "stem": "Which of the following is most associated with dental enamel erosion?", "options": [{"letter": "A", "text": "Anorexia nervosa only"}, {"letter": "B", "text": "Bulimia nervosa"}, {"letter": "C", "text": "Pica"}, {"letter": "D", "text": "Rumination disorder without vomiting"}], "answer": "B"}, {"id": 360, "topic": "Feeding and Eating Disorders", "number": 10, "stem": "How often must binge eating and compensatory behaviors occur to diagnose bulimia nervosa?", "options": [{"letter": "A", "text": "Daily for one month"}, {"letter": "B", "text": "At least once weekly for 3 months"}, {"letter": "C", "text": "Twice weekly for 6 months"}, {"letter": "D", "text": "Once monthly for a year"}, {"letter": "E", "text": "Continuously for 2 weeks"}], "answer": "B"}, {"id": 361, "topic": "Feeding and Eating Disorders", "number": 11, "stem": "Which antidepressant is FDA-approved for treatment of bulimia nervosa?", "options": [{"letter": "A", "text": "Fluoxetine"}, {"letter": "B", "text": "Lithium"}, {"letter": "C", "text": "Haloperidol"}, {"letter": "D", "text": "Diazepam"}], "answer": "A"}, {"id": 362, "topic": "Feeding and Eating Disorders", "number": 12, "stem": "Fluoxetine at 60 mg is most associated with pharmacological treatment of which disorder?", "options": [{"letter": "A", "text": "Anorexia nervosa"}, {"letter": "B", "text": "Pica"}, {"letter": "C", "text": "Bulimia nervosa"}, {"letter": "D", "text": "Rumination disorder"}], "answer": "C"}, {"id": 363, "topic": "Feeding and Eating Disorders", "number": 13, "stem": "Binge eating disorder differs from bulimia nervosa because it:", "options": [{"letter": "A", "text": "Occurs only in children"}, {"letter": "B", "text": "Includes psychosis"}, {"letter": "C", "text": "Lacks compensatory behaviors"}, {"letter": "D", "text": "Always causes severe underweight"}], "answer": "C"}, {"id": 364, "topic": "Feeding and Eating Disorders", "number": 14, "stem": "Which eating disorder is characterized by binge eating without compensatory behaviors?", "options": [{"letter": "A", "text": "Anorexia nervosa"}, {"letter": "B", "text": "Bulimia nervosa"}, {"letter": "C", "text": "Binge eating disorder"}, {"letter": "D", "text": "Purging disorder"}, {"letter": "E", "text": "ARFID"}], "answer": "C"}, {"id": 365, "topic": "Feeding and Eating Disorders", "number": 15, "stem": "A child repeatedly eats nonnutritive substances such as dirt or chalk for more than one month. This condition is called:", "options": [{"letter": "A", "text": "Rumination disorder"}, {"letter": "B", "text": "Pica"}, {"letter": "C", "text": "Bulimia nervosa"}, {"letter": "D", "text": "Anorexia nervosa"}], "answer": "B"}, {"id": 366, "topic": "Feeding and Eating Disorders", "number": 16, "stem": "Persistent eating of non-nutritive substances for at least one month describes which condition?", "options": [{"letter": "A", "text": "Rumination disorder"}, {"letter": "B", "text": "Pica"}, {"letter": "C", "text": "ARFID"}, {"letter": "D", "text": "OSFED"}, {"letter": "E", "text": "Night eating syndrome"}], "answer": "B"}, {"id": 367, "topic": "Feeding and Eating Disorders", "number": 17, "stem": "Which condition involves food restriction WITHOUT body image disturbance?", "options": [{"letter": "A", "text": "Anorexia nervosa"}, {"letter": "B", "text": "Bulimia nervosa"}, {"letter": "C", "text": "ARFID"}, {"letter": "D", "text": "Purging disorder"}, {"letter": "E", "text": "Binge eating disorder"}], "answer": "C"}, {"id": 368, "topic": "Feeding and Eating Disorders", "number": 18, "stem": "A severely malnourished patient with anorexia nervosa is admitted to the hospital. Which complication should be carefully monitored during refeeding?", "options": [{"letter": "A", "text": "Asthma"}, {"letter": "B", "text": "Refeeding syndrome"}, {"letter": "C", "text": "Appendicitis"}, {"letter": "D", "text": "Migraine"}], "answer": "B"}, {"id": 369, "topic": "Feeding and Eating Disorders", "number": 19, "stem": "Refeeding syndrome during nutritional rehabilitation is most dangerously associated with which electrolyte disturbance?", "options": [{"letter": "A", "text": "Hypernatremia"}, {"letter": "B", "text": "Hypercalcemia"}, {"letter": "C", "text": "Hypophosphatemia"}, {"letter": "D", "text": "Hyperkalemia"}, {"letter": "E", "text": "Hypercalcemia"}], "answer": "C"}, {"id": 370, "topic": "Feeding and Eating Disorders", "number": 20, "stem": "The most appropriate initial management of feeding and eating disorders usually includes:", "options": [{"letter": "A", "text": "Punishment-based therapy"}, {"letter": "B", "text": "Nutritional rehabilitation and psychotherapy"}, {"letter": "C", "text": "Surgery"}, {"letter": "D", "text": "Long-term sedation"}], "answer": "B"}, {"id": 371, "topic": "Dissociative Disorders", "number": 1, "stem": "Which mental function is typically disrupted in dissociative disorders?", "options": [{"letter": "A", "text": "Intelligence"}, {"letter": "B", "text": "Memory"}, {"letter": "C", "text": "Appetite"}, {"letter": "D", "text": "Language"}], "answer": "B"}, {"id": 372, "topic": "Dissociative Disorders", "number": 2, "stem": "Dissociative disorders are most commonly associated with:", "options": [{"letter": "A", "text": "Vitamin deficiency"}, {"letter": "B", "text": "Psychological trauma"}, {"letter": "C", "text": "Endocrine disease"}, {"letter": "D", "text": "Brain tumor"}, {"letter": "E", "text": "Hypertension"}], "answer": "B"}, {"id": 373, "topic": "Dissociative Disorders", "number": 3, "stem": "Dissociative amnesia is best defined as:", "options": [{"letter": "A", "text": "Loss of memory due to brain injury"}, {"letter": "B", "text": "Loss of memory in reaction to a traumatic event"}, {"letter": "C", "text": "Drug-induced memory loss"}, {"letter": "D", "text": "Age-related memory decline"}], "answer": "B"}, {"id": 374, "topic": "Dissociative Disorders", "number": 4, "stem": "Dissociative amnesia is characterized as being:", "options": [{"letter": "A", "text": "Physical rather than psychological."}, {"letter": "B", "text": "Neurological rather than functional."}, {"letter": "C", "text": "Psychological rather than physical."}, {"letter": "D", "text": "Systemic rather than localized."}], "answer": "C"}, {"id": 375, "topic": "Dissociative Disorders", "number": 5, "stem": "In dissociative amnesia, the forgotten information is usually:", "options": [{"letter": "A", "text": "General knowledge"}, {"letter": "B", "text": "Recent academic material"}, {"letter": "C", "text": "Autobiographical and stressful events"}, {"letter": "D", "text": "Language skills"}, {"letter": "E", "text": "Motor skills"}], "answer": "C"}, {"id": 376, "topic": "Dissociative Disorders", "number": 6, "stem": "Generalized amnesia is defined as:", "options": [{"letter": "A", "text": "Inability to recall events related to a circumscribed period of Time."}, {"letter": "B", "text": "Ability to remember some, but not all, of the events occurring during a circumscribed period of Time."}, {"letter": "C", "text": "Failure to recall one's entire life."}, {"letter": "D", "text": "Failure to remember a category of information."}], "answer": "C"}, {"id": 377, "topic": "Dissociative Disorders", "number": 7, "stem": "Which type of dissociative amnesia involves loss of memory for one’s entire life?", "options": [{"letter": "A", "text": "Localized amnesia"}, {"letter": "B", "text": "Selective amnesia"}, {"letter": "C", "text": "Continuous amnesia"}, {"letter": "D", "text": "Generalized amnesia"}, {"letter": "E", "text": "Systematized amnesia"}], "answer": "D"}, {"id": 378, "topic": "Dissociative Disorders", "number": 8, "stem": "Localized amnesia is defined as:", "options": [{"letter": "A", "text": "Failure to recall successive events as they occur."}, {"letter": "B", "text": "Inability to recall events related to a circumscribed period of Time."}, {"letter": "C", "text": "Failure to remember a category of information, such as all memories relating to one's family."}, {"letter": "D", "text": "Failure to recall one's entire life."}], "answer": "B"}, {"id": 379, "topic": "Dissociative Disorders", "number": 9, "stem": "Selective amnesia is defined as:", "options": [{"letter": "A", "text": "Failure to recall successive events as they occur."}, {"letter": "B", "text": "Inability to recall events related to a circumscribed period of Time."}, {"letter": "C", "text": "Failure to remember a category of information, such as all memories relating to a particular person."}, {"letter": "D", "text": "Ability to remember some, but not all, of the events occurring during a circumscribed period of Time."}], "answer": "D"}, {"id": 380, "topic": "Dissociative Disorders", "number": 10, "stem": "Failure to remember only some events during a specific period is called:", "options": [{"letter": "A", "text": "Localized amnesia"}, {"letter": "B", "text": "Generalized amnesia"}, {"letter": "C", "text": "Continuous amnesia"}, {"letter": "D", "text": "Selective amnesia"}, {"letter": "E", "text": "Systematized amnesia"}], "answer": "D"}, {"id": 381, "topic": "Dissociative Disorders", "number": 11, "stem": "Continuous amnesia is defined as:", "options": [{"letter": "A", "text": "Failure to recall successive events as they occur."}, {"letter": "B", "text": "Failure to recall one's entire life."}, {"letter": "C", "text": "Inability to recall events related to a circumscribed period of Time."}, {"letter": "D", "text": "Ability to remember some, but not all, of the events."}], "answer": "A"}, {"id": 382, "topic": "Dissociative Disorders", "number": 12, "stem": "Systematized amnesia is defined as:", "options": [{"letter": "A", "text": "Ability to remember some, but not all, of the events occurring during a circumscribed period of Time."}, {"letter": "B", "text": "Failure to recall successive events as they occur."}, {"letter": "C", "text": "Failure to remember a category of information, such as all memories relating to one's family or to a particular person."}, {"letter": "D", "text": "Failure to recall one's entire life."}], "answer": "C"}, {"id": 383, "topic": "Dissociative Disorders", "number": 13, "stem": "Dissociative fugue is best defined as:", "options": [{"letter": "A", "text": "Multiple personalities in the same person"}, {"letter": "B", "text": "Feeling detached from reality"}, {"letter": "C", "text": "Dissociative disorder characterized by loss of identity and travel to a new location"}, {"letter": "D", "text": "Inability to recall recent events"}], "answer": "C"}, {"id": 384, "topic": "Dissociative Disorders", "number": 14, "stem": "In DSM-5, dissociative fugue is classified as:", "options": [{"letter": "A", "text": "A subtype of schizophrenia"}, {"letter": "B", "text": "A separate dissociative disorder"}, {"letter": "C", "text": "A specifier of dissociative amnesia"}, {"letter": "D", "text": "A subtype of PTSD"}, {"letter": "E", "text": "A personality disorder"}], "answer": "C"}, {"id": 385, "topic": "Dissociative Disorders", "number": 15, "stem": "Dissociative fugue is described as:", "options": [{"letter": "A", "text": "Failure to recall successive events as they occur."}, {"letter": "B", "text": "Sudden, unexpected travel away from home or one's customary place of daily activities, with inability to recall some or all of one's past."}, {"letter": "C", "text": "Abnormality in the endogenous opioid system."}, {"letter": "D", "text": "A category of information loss relating only to one's family."}], "answer": "B"}, {"id": 386, "topic": "Dissociative Disorders", "number": 16, "stem": "Which feature best characterizes dissociative fugue?", "options": [{"letter": "A", "text": "Hallucinations with paranoia"}, {"letter": "B", "text": "Sudden travel with inability to recall the past"}, {"letter": "C", "text": "Persistent depressed mood only"}, {"letter": "D", "text": "Progressive memory loss due to dementia"}, {"letter": "E", "text": "Recurrent panic attacks"}], "answer": "B"}, {"id": 387, "topic": "Dissociative Disorders", "number": 17, "stem": "Dissociative identity disorder is defined by the presence of:", "options": [{"letter": "A", "text": "Chronic delusions"}, {"letter": "B", "text": "Two or more distinct identities"}, {"letter": "C", "text": "Persistent visual hallucinations"}, {"letter": "D", "text": "Intellectual disability"}, {"letter": "E", "text": "Continuous confusion only"}], "answer": "B"}, {"id": 388, "topic": "Dissociative Disorders", "number": 18, "stem": "Which disorder commonly coexists with dissociative identity disorder?", "options": [{"letter": "A", "text": "Parkinson disease"}, {"letter": "B", "text": "Obsessive-compulsive symptoms"}, {"letter": "C", "text": "Myasthenia gravis"}, {"letter": "D", "text": "Hyperthyroidism"}, {"letter": "E", "text": "Migraine without aura"}], "answer": "B"}, {"id": 389, "topic": "Dissociative Disorders", "number": 19, "stem": "Depersonalization is biologically characterized by:", "options": [{"letter": "A", "text": "Age regression in hypnosis therapy."}, {"letter": "B", "text": "Effective treatment using Cognitive Behavioral Therapy (CBT)."}, {"letter": "C", "text": "Abnormality in the endogenous opioid system."}, {"letter": "D", "text": "Sudden, unexpected travel away from home."}], "answer": "C"}, {"id": 390, "topic": "Dissociative Disorders", "number": 20, "stem": "During depersonalization or derealization episodes, the patient usually:", "options": [{"letter": "A", "text": "Completely loses consciousness"}, {"letter": "B", "text": "Has impaired reality testing"}, {"letter": "C", "text": "Retains intact reality testing"}, {"letter": "D", "text": "Develops severe amnesia immediately"}, {"letter": "E", "text": "Becomes disoriented to place only"}], "answer": "C"}, {"id": 391, "topic": "Psychiatric Considerations in Medical Disorders", "number": 1, "stem": "A 55-year-old patient with chronic kidney disease on hemodialysis develops depression. Which antidepressant is the SAFEST to use?", "options": [{"letter": "A", "text": "Amitriptyline"}, {"letter": "B", "text": "Sertraline"}, {"letter": "C", "text": "Lithium"}, {"letter": "D", "text": "Venlafaxine"}], "answer": "B"}, {"id": 392, "topic": "Psychiatric Considerations in Medical Disorders", "number": 2, "stem": "Which antidepressant is considered the drug of choice for depression in cardiovascular disease?", "options": [{"letter": "A", "text": "Amitriptyline"}, {"letter": "B", "text": "Imipramine"}, {"letter": "C", "text": "Sertraline"}, {"letter": "D", "text": "Clomipramine"}, {"letter": "E", "text": "Nortriptyline"}], "answer": "C"}, {"id": 393, "topic": "Psychiatric Considerations in Medical Disorders", "number": 3, "stem": "Which antidepressant is CONTRAINDICATED in a patient who recently had a myocardial infarction?", "options": [{"letter": "A", "text": "Sertraline"}, {"letter": "B", "text": "Escitalopram"}, {"letter": "C", "text": "Tricyclic Antidepressants (TCAs)"}, {"letter": "D", "text": "Mirtazapine"}], "answer": "C"}, {"id": 394, "topic": "Psychiatric Considerations in Medical Disorders", "number": 4, "stem": "A patient with hypothyroidism presents with fatigue, weight gain, and depressed mood. What is the FIRST step in management?", "options": [{"letter": "A", "text": "Start SSRI immediately"}, {"letter": "B", "text": "Start antipsychotics"}, {"letter": "C", "text": "Treat the underlying thyroid disorder First"}], "answer": "C"}, {"id": 395, "topic": "Psychiatric Considerations in Medical Disorders", "number": 5, "stem": "Which psychiatric symptom is most commonly associated with Graves’ disease?", "options": [{"letter": "A", "text": "Apathy"}, {"letter": "B", "text": "Irritability"}, {"letter": "C", "text": "Catatonia"}, {"letter": "D", "text": "Hallucinations"}, {"letter": "E", "text": "Mutism"}], "answer": "B"}, {"id": 396, "topic": "Psychiatric Considerations in Medical Disorders", "number": 6, "stem": "A diabetic patient reports feeling overwhelmed, frustrated, and burned out specifically about managing his diabetes, but does not meet criteria for MDD. What is the MOST likely diagnosis?", "options": [{"letter": "A", "text": "Adjustment Disorder"}, {"letter": "B", "text": "Generalized Anxiety Disorder"}, {"letter": "C", "text": "Diabetes Distress"}, {"letter": "D", "text": "Dysthymia"}], "answer": "C"}, {"id": 397, "topic": "Psychiatric Considerations in Medical Disorders", "number": 7, "stem": "Women with type 1 diabetes may intentionally reduce insulin doses primarily to:", "options": [{"letter": "A", "text": "Prevent hypoglycemia"}, {"letter": "B", "text": "Improve glucose control"}, {"letter": "C", "text": "Achieve caloric purging"}, {"letter": "D", "text": "Reduce injection pain"}, {"letter": "E", "text": "Prevent ketoacidosis"}], "answer": "C"}, {"id": 398, "topic": "Psychiatric Considerations in Medical Disorders", "number": 8, "stem": "Which neurological disorder has the highest association with psychiatric disturbances?", "options": [{"letter": "A", "text": "Parkinson disease"}, {"letter": "B", "text": "Multiple sclerosis"}, {"letter": "C", "text": "Epilepsy"}, {"letter": "D", "text": "Myasthenia gravis"}, {"letter": "E", "text": "Migraine"}], "answer": "C"}, {"id": 399, "topic": "Psychiatric Considerations in Medical Disorders", "number": 9, "stem": "Which state includes behaviors that are a direct manifestation of seizure activity?", "options": [{"letter": "A", "text": "Interictal state"}, {"letter": "B", "text": "Postictal state"}, {"letter": "C", "text": "Peri-ictal state"}, {"letter": "D", "text": "Ictal state"}, {"letter": "E", "text": "Prodromal state"}], "answer": "D"}, {"id": 400, "topic": "Psychiatric Considerations in Medical Disorders", "number": 10, "stem": "The most definitive method to confirm ictal psychosis is:", "options": [{"letter": "A", "text": "CT brain"}, {"letter": "B", "text": "MRI brain"}, {"letter": "C", "text": "EEG recording"}, {"letter": "D", "text": "Lumbar puncture"}, {"letter": "E", "text": "PET scan"}], "answer": "C"}, {"id": 401, "topic": "Psychiatric Considerations in Medical Disorders", "number": 11, "stem": "The most common psychiatric comorbidity in patients with epilepsy is:", "options": [{"letter": "A", "text": "Mania"}, {"letter": "B", "text": "Schizophrenia"}, {"letter": "C", "text": "Depression"}, {"letter": "D", "text": "OCD"}, {"letter": "E", "text": "Delirium"}], "answer": "C"}, {"id": 402, "topic": "Psychiatric Considerations in Medical Disorders", "number": 12, "stem": "Which of the following BEST differentiates Delirium from Dementia?", "options": [{"letter": "A", "text": "Memory impairment"}, {"letter": "B", "text": "Acute onset and fluctuating consciousness"}, {"letter": "C", "text": "Disorientation"}, {"letter": "D", "text": "Visual hallucinations"}], "answer": "B"}, {"id": 403, "topic": "Psychiatric Considerations in Medical Disorders", "number": 13, "stem": "Which is the most common non-cognitive neuropsychiatric consequence of stroke?", "options": [{"letter": "A", "text": "Anxiety disorder"}, {"letter": "B", "text": "Post-stroke depression"}, {"letter": "C", "text": "Delirium"}, {"letter": "D", "text": "Mania"}, {"letter": "E", "text": "Dementia"}], "answer": "B"}, {"id": 404, "topic": "Psychiatric Considerations in Medical Disorders", "number": 14, "stem": "Which of the following is a proposed mechanism for post-stroke depression?", "options": [{"letter": "A", "text": "Vitamin D deficiency"}, {"letter": "B", "text": "Gene polymorphism"}, {"letter": "C", "text": "Hypercalcemia"}, {"letter": "D", "text": "Autoimmune thyroiditis"}, {"letter": "E", "text": "Iron deficiency"}], "answer": "B"}, {"id": 405, "topic": "Psychiatric Considerations in Medical Disorders", "number": 15, "stem": "In HIV-associated dementia, an early clinical feature is:", "options": [{"letter": "A", "text": "Aphasia"}, {"letter": "B", "text": "Apathy"}, {"letter": "C", "text": "Tremor"}, {"letter": "D", "text": "Euphoria"}, {"letter": "E", "text": "Catatonia"}], "answer": "B"}, {"id": 406, "topic": "Psychiatric Considerations in Medical Disorders", "number": 16, "stem": "A patient with liver cirrhosis develops confusion, agitation, and sleep disturbance. What is the MOST likely cause?", "options": [{"letter": "A", "text": "Primary psychosis"}, {"letter": "B", "text": "Hepatic Encephalopathy"}, {"letter": "C", "text": "Alcohol withdrawal only"}, {"letter": "D", "text": "Bipolar mania"}], "answer": "B"}, {"id": 407, "topic": "Psychiatric Considerations in Medical Disorders", "number": 17, "stem": "A cancer patient expresses sadness, hopelessness, and loss of interest 2 weeks after diagnosis. What is the MOST appropriate initial intervention?", "options": [{"letter": "A", "text": "Start chemotherapy adjustment"}, {"letter": "B", "text": "Immediate hospitalization"}, {"letter": "C", "text": "Psychosocial support and watchful waiting"}, {"letter": "D", "text": "Start antipsychotics"}], "answer": "C"}, {"id": 408, "topic": "Psychiatric Considerations in Medical Disorders", "number": 18, "stem": "Which of the following is the MOST common psychiatric comorbidity in patients with chronic pain?", "options": [{"letter": "A", "text": "Schizophrenia"}, {"letter": "B", "text": "Bipolar Disorder"}, {"letter": "C", "text": "Depression and Anxiety"}, {"letter": "D", "text": "OCD"}], "answer": "C"}, {"id": 409, "topic": "Psychiatric Considerations in Medical Disorders", "number": 19, "stem": "Which psychological therapy has the STRONGEST evidence in managing Chronic Pain Syndrome?", "options": [{"letter": "A", "text": "Psychoanalysis"}, {"letter": "B", "text": "Cognitive Behavioral Therapy (CBT)"}, {"letter": "C", "text": "Hypnotherapy"}, {"letter": "D", "text": "Supportive therapy alone"}], "answer": "B"}, {"id": 410, "topic": "Psychiatric Considerations in Medical Disorders", "number": 20, "stem": "Poor medication adherence in chronic medical illness is MOST strongly associated with:", "options": [{"letter": "A", "text": "High income level"}, {"letter": "B", "text": "Untreated depression"}, {"letter": "C", "text": "Young age"}, {"letter": "D", "text": "Urban residence"}], "answer": "B"}, {"id": 411, "topic": "Psychopharmacology (Part 1)", "number": 1, "stem": "Chlorpromazine was originally developed as a:", "options": [{"letter": "A", "text": "Antidepressant"}, {"letter": "B", "text": "Surgical anesthetic"}, {"letter": "C", "text": "Mood stabilizer"}, {"letter": "D", "text": "Anticonvulsant"}, {"letter": "E", "text": "Sedative-hypnotic"}], "answer": "B"}, {"id": 412, "topic": "Psychopharmacology (Part 1)", "number": 2, "stem": "The main antipsychotic action of haloperidol is through blockade of:", "options": [{"letter": "A", "text": "D1 receptors"}, {"letter": "B", "text": "D2 receptors"}, {"letter": "C", "text": "GABA receptors"}, {"letter": "D", "text": "NMDA receptors"}, {"letter": "E", "text": "1 receptors"}], "answer": "B"}, {"id": 413, "topic": "Psychopharmacology (Part 1)", "number": 3, "stem": "Excess dopamine activity in which pathway is most closely linked to psychotic symptoms?", "options": [{"letter": "A", "text": "Nigrostriatal pathway"}, {"letter": "B", "text": "Mesolimbic pathway"}, {"letter": "C", "text": "Tuberoinfundibular pathway"}, {"letter": "D", "text": "Mesocortical pathway"}, {"letter": "E", "text": "Spinothalamic pathway"}], "answer": "B"}, {"id": 414, "topic": "Psychopharmacology (Part 1)", "number": 4, "stem": "Antipsychotic drug potency mainly reflects its:", "options": [{"letter": "A", "text": "Clinical effectiveness"}, {"letter": "B", "text": "Duration of action"}, {"letter": "C", "text": "Affinity for dopamine receptors"}, {"letter": "D", "text": "Lipid solubility"}, {"letter": "E", "text": "Sedative effect"}], "answer": "C"}, {"id": 415, "topic": "Psychopharmacology (Part 1)", "number": 5, "stem": "Blockade of D2 receptors in the nigrostriatal pathway mainly contributes to:", "options": [{"letter": "A", "text": "Better antidepressant effect"}, {"letter": "B", "text": "Extrapyramidal side effects"}, {"letter": "C", "text": "Improved cognition"}, {"letter": "D", "text": "Weight loss"}, {"letter": "E", "text": "Analgesia"}], "answer": "B"}, {"id": 416, "topic": "Psychopharmacology (Part 1)", "number": 6, "stem": "Compared with low-potency agents, high-potency antipsychotics such as haloperidol generally produce:", "options": [{"letter": "A", "text": "Greater sedation"}, {"letter": "B", "text": "More antihistaminic activity"}, {"letter": "C", "text": "Less sleepiness"}, {"letter": "D", "text": "More anticholinergic effects"}, {"letter": "E", "text": "Higher weight gain"}], "answer": "C"}, {"id": 417, "topic": "Psychopharmacology (Part 1)", "number": 7, "stem": "Besides dopamine receptors, atypical antipsychotics commonly block:", "options": [{"letter": "A", "text": "H1 receptors"}, {"letter": "B", "text": "2 receptors"}, {"letter": "C", "text": "5-HT2A receptors"}, {"letter": "D", "text": "Muscarinic M3 receptors"}, {"letter": "E", "text": "NMDA receptors"}], "answer": "C"}, {"id": 418, "topic": "Psychopharmacology (Part 1)", "number": 8, "stem": "Clozapine and quetiapine have a lower risk of extrapyramidal symptoms mainly because they:", "options": [{"letter": "A", "text": "Permanently block D2 receptors"}, {"letter": "B", "text": "Increase acetylcholine release"}, {"letter": "C", "text": "Have transient D2 binding with serotonin antagonism"}, {"letter": "D", "text": "Stimulate dopamine release directly"}, {"letter": "E", "text": "Inhibit MAO enzymes"}], "answer": "C"}, {"id": 419, "topic": "Psychopharmacology (Part 1)", "number": 9, "stem": "Which of the following side effects is more common with Clozapine?", "options": [{"letter": "A", "text": "Agranulocytosis"}, {"letter": "B", "text": "Neuroleptic malignant syndrome"}, {"letter": "C", "text": "Tardive dyskinesia"}, {"letter": "D", "text": "Parkinsonism"}], "answer": "A"}, {"id": 420, "topic": "Psychopharmacology (Part 1)", "number": 10, "stem": "What is the First-line treatment for ADHD?", "options": [{"letter": "A", "text": "Haloperidol"}, {"letter": "B", "text": "Clonidine"}, {"letter": "C", "text": "Methylphenidate"}, {"letter": "D", "text": "Cognitive behavioral therapy"}], "answer": "C"}, {"id": 421, "topic": "Psychopharmacology (Part 1)", "number": 11, "stem": "Which of the following drugs is used to treat nocturnal enuresis?", "options": [{"letter": "A", "text": "Imipramine"}, {"letter": "B", "text": "Lithium"}, {"letter": "C", "text": "Chlorpromazine"}, {"letter": "D", "text": "Clozapine"}], "answer": "A"}, {"id": 422, "topic": "Psychopharmacology (Part 1)", "number": 12, "stem": "Which two organ functions must be regularly checked via routine monitoring when a patient is taking Lithium?", "options": [{"letter": "A", "text": "Liver and Cardiac"}, {"letter": "B", "text": "Thyroid and Renal"}, {"letter": "C", "text": "Pancreas and Gastric"}, {"letter": "D", "text": "Brain and Pulmonary"}], "answer": "B"}, {"id": 423, "topic": "Psychopharmacology (Part 1)", "number": 13, "stem": "Which of the following drugs decrease Lithium clearance?", "options": [{"letter": "A", "text": "Thiazides"}, {"letter": "B", "text": "NSAIDs"}, {"letter": "C", "text": "ACE inhibitors"}, {"letter": "D", "text": "All of the above"}], "answer": "D"}, {"id": 424, "topic": "Psychopharmacology (Part 1)", "number": 14, "stem": "Which of the following is a recognized use of antidepressants?", "options": [{"letter": "A", "text": "Acute bacterial meningitis"}, {"letter": "B", "text": "Major depressive disorder"}, {"letter": "C", "text": "Parkinson disease"}, {"letter": "D", "text": "Hyperthyroidism"}, {"letter": "E", "text": "Peptic ulcer disease"}], "answer": "B"}, {"id": 425, "topic": "Psychopharmacology (Part 1)", "number": 15, "stem": "Which of the following is a common adverse effect of antidepressants?", "options": [{"letter": "A", "text": "Hypoglycemia"}, {"letter": "B", "text": "Dry mouth"}, {"letter": "C", "text": "Bradycardia"}, {"letter": "D", "text": "Neutropenia"}, {"letter": "E", "text": "Hearing loss"}], "answer": "B"}, {"id": 426, "topic": "Psychopharmacology (Part 1)", "number": 16, "stem": "SSRIs would be effective in treating all of the following conditions except:", "options": [{"letter": "A", "text": "OCD"}, {"letter": "B", "text": "Bipolar disorder"}, {"letter": "C", "text": "Depression"}, {"letter": "D", "text": "Generalized anxiety disorder"}], "answer": "B"}, {"id": 427, "topic": "Psychopharmacology (Part 1)", "number": 17, "stem": "For a patient suffering from PTSD, which of the following is the most appropriate pharmacotherapy?", "options": [{"letter": "A", "text": "Antipsychotics"}, {"letter": "B", "text": "Lithium"}, {"letter": "C", "text": "Benzodiazepines"}, {"letter": "D", "text": "SSRIs"}], "answer": "D"}, {"id": 428, "topic": "Psychopharmacology (Part 1)", "number": 18, "stem": "Which of the following are classic adverse effects or signs of Amitriptyline toxicity?", "options": [{"letter": "A", "text": "Convulsions"}, {"letter": "B", "text": "Coma"}, {"letter": "C", "text": "Cardiotoxicity"}, {"letter": "D", "text": "All of the above"}], "answer": "D"}, {"id": 429, "topic": "Psychopharmacology (Part 1)", "number": 19, "stem": "Combining an MAOI with an SSRI may lead to which of the following?", "options": [{"letter": "A", "text": "Neuroleptic malignant syndrome"}, {"letter": "B", "text": "Cushing syndrome"}, {"letter": "C", "text": "Serotonin syndrome"}, {"letter": "D", "text": "Stevens-Johnson syndrome"}], "answer": "C"}, {"id": 430, "topic": "Psychopharmacology (Part 1)", "number": 20, "stem": "What is the classic adverse effect of Trazodone?", "options": [{"letter": "A", "text": "Agranulocytosis"}, {"letter": "B", "text": "Priapism"}, {"letter": "C", "text": "Hyperglycemia"}, {"letter": "D", "text": "Nephrotoxicity"}], "answer": "B"}, {"id": 431, "topic": "Psychotherapy", "number": 1, "stem": "Who First used the term 'psychoanalysis' in 1896?", "options": [{"letter": "A", "text": "Carl Jung"}, {"letter": "B", "text": "Sigmund Freud"}, {"letter": "C", "text": "Alfred Adler"}, {"letter": "D", "text": "Albert Ellis"}], "answer": "B"}, {"id": 432, "topic": "Psychotherapy", "number": 2, "stem": "Which structural component of personality operates merely on the \"pleasure principle\"?", "options": [{"letter": "A", "text": "Ego"}, {"letter": "B", "text": "Conscious"}, {"letter": "C", "text": "Id"}], "answer": "C"}, {"id": 433, "topic": "Psychotherapy", "number": 3, "stem": "The Ego operates on which of the following principles?", "options": [{"letter": "A", "text": "Pleasure principle"}, {"letter": "B", "text": "Reality principle"}, {"letter": "C", "text": "Moral principle"}, {"letter": "D", "text": "All-or-nothing principle"}], "answer": "B"}, {"id": 434, "topic": "Psychotherapy", "number": 4, "stem": "What is the First stage in Freud's psychosexual phases of development?", "options": [{"letter": "A", "text": "Anal"}, {"letter": "B", "text": "Phallic"}, {"letter": "C", "text": "Oral"}, {"letter": "D", "text": "Latency"}], "answer": "C"}, {"id": 435, "topic": "Psychotherapy", "number": 5, "stem": "The following techniques are used in Supportive Psychotherapy, except", "options": [{"letter": "A", "text": "Free Association"}, {"letter": "B", "text": "Guidance"}, {"letter": "C", "text": "Suggestion"}, {"letter": "D", "text": "Reassurance"}], "answer": "A"}, {"id": 436, "topic": "Psychotherapy", "number": 6, "stem": "Which defense mechanism involves hiding a feeling and forcing it from the conscious to the unconscious?", "options": [{"letter": "A", "text": "Projection"}, {"letter": "B", "text": "Repression"}, {"letter": "C", "text": "Regression"}, {"letter": "D", "text": "Denial"}], "answer": "B"}, {"id": 437, "topic": "Psychotherapy", "number": 7, "stem": "A patient who returns to childish behavior during stress is using which defense mechanism?", "options": [{"letter": "A", "text": "Conversion"}, {"letter": "B", "text": "Regression"}, {"letter": "C", "text": "Distortion"}, {"letter": "D", "text": "Splitting"}], "answer": "B"}, {"id": 438, "topic": "Psychotherapy", "number": 8, "stem": "Falling back into an earlier state of mental or physical development that is seen as \"safer\" is called:", "options": [{"letter": "A", "text": "Regression"}, {"letter": "B", "text": "Sublimation"}, {"letter": "C", "text": "Conversion"}, {"letter": "D", "text": "Distortion"}], "answer": "A"}, {"id": 439, "topic": "Psychotherapy", "number": 9, "stem": "Which defense mechanism is considered the most socially acceptable expression of anxiety?", "options": [{"letter": "A", "text": "Denial"}, {"letter": "B", "text": "Projection"}, {"letter": "C", "text": "Sublimation"}, {"letter": "D", "text": "Conversion"}], "answer": "C"}, {"id": 440, "topic": "Psychotherapy", "number": 10, "stem": "A wife who is unconsciously attracted to another man becomes excessively affectionate toward her husband. This is an example of:", "options": [{"letter": "A", "text": "Projection"}, {"letter": "B", "text": "Reaction formation"}, {"letter": "C", "text": "Splitting"}, {"letter": "D", "text": "Repression"}], "answer": "B"}, {"id": 441, "topic": "Psychotherapy", "number": 11, "stem": "Expressing an intrapsychic conflict as a physical symptom (such as blindness or paralysis) is known as:", "options": [{"letter": "A", "text": "Denial"}, {"letter": "B", "text": "Conversion"}, {"letter": "C", "text": "Splitting"}, {"letter": "D", "text": "Reaction formation"}], "answer": "B"}, {"id": 442, "topic": "Psychotherapy", "number": 12, "stem": "The modern roots of Cognitive Behavioral Therapy resulted from the merging of:", "options": [{"letter": "A", "text": "Psychoanalysis and hypnosis"}, {"letter": "B", "text": "Behavioral therapy and cognitive therapy"}, {"letter": "C", "text": "Humanistic therapy and psychoanalysis"}, {"letter": "D", "text": "Gestalt therapy and behaviorism"}], "answer": "B"}, {"id": 443, "topic": "Psychotherapy", "number": 13, "stem": "Which scientist's work on conditioning strongly influenced the development of behavioral therapy techniques?", "options": [{"letter": "A", "text": "Sigmund Freud"}, {"letter": "B", "text": "Alfred Adler"}, {"letter": "C", "text": "Ivan Pavlov"}, {"letter": "D", "text": "Carl Gustav Jung"}], "answer": "C"}, {"id": 444, "topic": "Psychotherapy", "number": 14, "stem": "Who developed the earliest cognitive-based psychotherapy known as Rational Emotive Behavior Therapy (REBT)?", "options": [{"letter": "A", "text": "Albert Ellis"}, {"letter": "B", "text": "Joseph Wolpe"}, {"letter": "C", "text": "Aaron Beck"}, {"letter": "D", "text": "Rosalie Rayner"}], "answer": "A"}, {"id": 445, "topic": "Psychotherapy", "number": 15, "stem": "“Seeing life only in black-and-white categories with no middle ground” describes which cognitive distortion?", "options": [{"letter": "A", "text": "Emotional reasoning"}, {"letter": "B", "text": "Mental Filtering"}, {"letter": "C", "text": "All-or-nothing thinking"}, {"letter": "D", "text": "Fortune-telling"}], "answer": "C"}, {"id": 446, "topic": "Psychotherapy", "number": 16, "stem": "Looking at life in extreme \"black-and-white\" categories with no in-between is known as:", "options": [{"letter": "A", "text": "All-or-nothing thinking"}, {"letter": "B", "text": "Fortune-telling"}, {"letter": "C", "text": "Mind reading"}, {"letter": "D", "text": "Personalization"}], "answer": "A"}, {"id": 447, "topic": "Psychotherapy", "number": 17, "stem": "Predicting negative outcomes of events before they happen is called:", "options": [{"letter": "A", "text": "Mind reading"}, {"letter": "B", "text": "Fortune-telling"}, {"letter": "C", "text": "Labeling"}, {"letter": "D", "text": "Personalization"}], "answer": "B"}, {"id": 448, "topic": "Psychotherapy", "number": 18, "stem": "Inferring a person's thoughts from their behavior without asking them is a subtype of jumping to conclusions called:", "options": [{"letter": "A", "text": "Fortune-telling"}, {"letter": "B", "text": "Mind reading"}, {"letter": "C", "text": "Minimization"}, {"letter": "D", "text": "Labeling"}], "answer": "B"}, {"id": 449, "topic": "Psychotherapy", "number": 19, "stem": "A person who focuses only on the negative details of a situation while ignoring the positive aspects is demonstrating:", "options": [{"letter": "A", "text": "Mental Filtering"}, {"letter": "B", "text": "Overgeneralization"}, {"letter": "C", "text": "Catastrophizing"}, {"letter": "D", "text": "Splitting"}], "answer": "A"}, {"id": 450, "topic": "Psychotherapy", "number": 20, "stem": "Giving greater weight to the worst possible outcome, however unlikely, is called:", "options": [{"letter": "A", "text": "Emotional reasoning"}, {"letter": "B", "text": "Catastrophizing"}, {"letter": "C", "text": "Blaming"}, {"letter": "D", "text": "Overgeneralizing"}], "answer": "B"}, {"id": 451, "topic": "Personality Disorders", "number": 1, "stem": "What is the estimated median rate of diagnosable Personality Disorders in the general population?", "options": [{"letter": "A", "text": "5.2%"}, {"letter": "B", "text": "10.6%"}, {"letter": "C", "text": "20.0%"}, {"letter": "D", "text": "40-60%"}], "answer": "B"}, {"id": 452, "topic": "Personality Disorders", "number": 2, "stem": "Generally, all personality disorders are more prevalent in males EXCEPT:", "options": [{"letter": "A", "text": "Paranoid and Schizoid"}, {"letter": "B", "text": "Borderline, Histrionic, and Dependent"}, {"letter": "C", "text": "Antisocial and Narcissistic"}, {"letter": "D", "text": "Schizotypal and OCPD"}], "answer": "B"}, {"id": 453, "topic": "Personality Disorders", "number": 3, "stem": "Decreased levels of which neurotransmitter are associated with impulsivity and aggression?", "options": [{"letter": "A", "text": "Dopamine"}, {"letter": "B", "text": "Serotonin (SE)"}, {"letter": "C", "text": "Norepinephrine (NE)"}, {"letter": "D", "text": "Acetylcholine"}], "answer": "B"}, {"id": 454, "topic": "Personality Disorders", "number": 4, "stem": "Which Personality Disorder cluster is described as \"odd or eccentric\"?", "options": [{"letter": "A", "text": "Cluster A"}, {"letter": "B", "text": "Cluster C"}, {"letter": "C", "text": "Cluster B"}], "answer": "A"}, {"id": 455, "topic": "Personality Disorders", "number": 5, "stem": "Paranoid and schizoid personality disorders belong to:", "options": [{"letter": "A", "text": "Cluster A"}, {"letter": "B", "text": "Cluster B"}, {"letter": "C", "text": "Cluster C"}, {"letter": "D", "text": "Mood disorders"}], "answer": "A"}, {"id": 456, "topic": "Personality Disorders", "number": 6, "stem": "Which of these is a personality disorder characterized by extreme suspiciousness and distrust of others?", "options": [{"letter": "A", "text": "Paranoid Personality Disorder"}, {"letter": "B", "text": "Narcissistic Personality Disorder"}, {"letter": "C", "text": "Obsessive-Compulsive Personality Disorder"}, {"letter": "D", "text": "Antisocial Personality Disorder"}], "answer": "A"}, {"id": 457, "topic": "Personality Disorders", "number": 7, "stem": "Which Personality Disorder is characterized by a pattern of irrational suspicion and mistrust of others?", "options": [{"letter": "A", "text": "Schizoid Personality Disorder"}, {"letter": "B", "text": "Paranoid Personality Disorder"}, {"letter": "C", "text": "Borderline Personality Disorder"}, {"letter": "D", "text": "Narcissistic Personality Disorder"}], "answer": "B"}, {"id": 458, "topic": "Personality Disorders", "number": 8, "stem": "A patient who is detached from social relationships, prefers solitary activities, and shows restricted emotional expression most likely has:", "options": [{"letter": "A", "text": "Schizotypal Personality Disorder"}, {"letter": "B", "text": "Avoidant Personality Disorder"}, {"letter": "C", "text": "Schizoid Personality Disorder"}, {"letter": "D", "text": "Borderline Personality Disorder"}], "answer": "C"}, {"id": 459, "topic": "Personality Disorders", "number": 9, "stem": "Magical thinking, odd beliefs, and peculiar behaviors are characteristic of which disorder?", "options": [{"letter": "A", "text": "Schizoid Personality Disorder"}, {"letter": "B", "text": "Schizotypal Personality Disorder"}, {"letter": "C", "text": "Paranoid Personality Disorder"}, {"letter": "D", "text": "Narcissistic Personality Disorder"}], "answer": "B"}, {"id": 460, "topic": "Personality Disorders", "number": 10, "stem": "According to DSM-5, Cluster B includes which group of disorders?", "options": [{"letter": "A", "text": "Paranoid, Schizoid, Schizotypal"}, {"letter": "B", "text": "Avoidant, Dependent, Obsessive-compulsive"}, {"letter": "C", "text": "Antisocial, Borderline, Histrionic, Narcissistic"}, {"letter": "D", "text": "Depressive, Passive-aggressive"}], "answer": "C"}, {"id": 461, "topic": "Personality Disorders", "number": 11, "stem": "A person who completely lacks empathy, breaks the law, and violates the rights of others might have:", "options": [{"letter": "A", "text": "Schizotypal Personality Disorder"}, {"letter": "B", "text": "Antisocial Personality Disorder"}, {"letter": "C", "text": "Paranoid Personality Disorder"}, {"letter": "D", "text": "Dependent Personality Disorder"}], "answer": "B"}, {"id": 462, "topic": "Personality Disorders", "number": 12, "stem": "Lack of guilt and repeated illegal acts are common in:", "options": [{"letter": "A", "text": "Dependent PD"}, {"letter": "B", "text": "Antisocial PD"}, {"letter": "C", "text": "Avoidant PD"}, {"letter": "D", "text": "Schizoid PD"}], "answer": "B"}, {"id": 463, "topic": "Personality Disorders", "number": 13, "stem": "Severe instability in mood, relationships, and self-image is the main feature of:", "options": [{"letter": "A", "text": "Borderline Personality Disorder"}, {"letter": "B", "text": "Schizotypal Personality Disorder"}, {"letter": "C", "text": "Dependent Personality Disorder"}, {"letter": "D", "text": "Paranoid Personality Disorder"}], "answer": "A"}, {"id": 464, "topic": "Personality Disorders", "number": 14, "stem": "Fear of abandonment is a feature of:", "options": [{"letter": "A", "text": "Borderline PD"}, {"letter": "B", "text": "Paranoid PD"}, {"letter": "C", "text": "Avoidant PD"}, {"letter": "D", "text": "Schizotypal PD"}], "answer": "A"}, {"id": 465, "topic": "Personality Disorders", "number": 15, "stem": "Which disorder involves a grand sense of self-importance and a need for constant admiration?", "options": [{"letter": "A", "text": "Paranoid Personality Disorder"}, {"letter": "B", "text": "Narcissistic Personality Disorder"}, {"letter": "C", "text": "Obsessive-Compulsive Personality Disorder"}, {"letter": "D", "text": "Dependent Personality Disorder"}], "answer": "B"}, {"id": 466, "topic": "Personality Disorders", "number": 16, "stem": "Attention-seeking behavior and excessive emotionality (acting dramatic) is typical", "options": [{"letter": "A", "text": "Histrionic Personality Disorder"}, {"letter": "B", "text": "Avoidant Personality Disorder"}, {"letter": "C", "text": "Schizotypal Personality Disorder"}, {"letter": "D", "text": "Dependent Personality Disorder"}], "answer": "A"}, {"id": 467, "topic": "Personality Disorders", "number": 17, "stem": "Which Personality Disorder involves a pervasive pattern of attention-seeking behavior and excessive emotions?", "options": [{"letter": "A", "text": "Histrionic Personality Disorder"}, {"letter": "B", "text": "Dependent Personality Disorder"}, {"letter": "C", "text": "Antisocial Personality Disorder"}, {"letter": "D", "text": "Schizotypal Personality Disorder"}], "answer": "A"}, {"id": 468, "topic": "Personality Disorders", "number": 18, "stem": "Avoiding social situations because of intense fear of rejection and feelings of inadequacy is called:", "options": [{"letter": "A", "text": "Avoidant Personality Disorder"}, {"letter": "B", "text": "Narcissistic Personality Disorder"}, {"letter": "C", "text": "Schizotypal Personality Disorder"}, {"letter": "D", "text": "Antisocial Personality Disorder"}], "answer": "A"}, {"id": 469, "topic": "Personality Disorders", "number": 19, "stem": "Which Cluster C disorder is characterized by extreme sensitivity to negative evaluation, feelings of inadequacy, and social inhibition?", "options": [{"letter": "A", "text": "Dependent Personality Disorder"}, {"letter": "B", "text": "Avoidant Personality Disorder"}, {"letter": "C", "text": "Obsessive-compulsive Personality Disorder"}, {"letter": "D", "text": "Paranoid Personality Disorder"}], "answer": "B"}, {"id": 470, "topic": "Personality Disorders", "number": 20, "stem": "A person who is overly dependent on others to make decisions and has a fear of being alone may have:", "options": [{"letter": "A", "text": "Dependent Personality Disorder"}, {"letter": "B", "text": "Histrionic Personality Disorder"}, {"letter": "C", "text": "Schizotypal Personality Disorder"}, {"letter": "D", "text": "Paranoid Personality Disorder"}], "answer": "A"}, {"id": 471, "topic": "Crisis & Disaster Mental Health", "number": 1, "stem": "A disaster is a:", "options": [{"letter": "A", "text": "Normal event"}, {"letter": "B", "text": "Critical incident"}, {"letter": "C", "text": "Daily activity"}, {"letter": "D", "text": "Small problem"}], "answer": "B"}, {"id": 472, "topic": "Crisis & Disaster Mental Health", "number": 2, "stem": "Which of these is a natural disaster?", "options": [{"letter": "A", "text": "Car accident"}, {"letter": "B", "text": "Airplane crash"}, {"letter": "C", "text": "Flood"}, {"letter": "D", "text": "Fire at home"}], "answer": "C"}, {"id": 473, "topic": "Crisis & Disaster Mental Health", "number": 3, "stem": "Earthquakes are classified as:", "options": [{"letter": "A", "text": "Human-made disasters"}, {"letter": "B", "text": "Natural disasters"}, {"letter": "C", "text": "Economic problems"}, {"letter": "D", "text": "Social events"}], "answer": "B"}, {"id": 474, "topic": "Crisis & Disaster Mental Health", "number": 4, "stem": "In a disaster, how does the psychological \"footprint\" compare to the medical \"footprint\"?", "options": [{"letter": "A", "text": "The medical footprint is much larger."}, {"letter": "B", "text": "The psychological footprint greatly exceeds the medical footprint."}, {"letter": "C", "text": "Both footprints are always equal."}, {"letter": "D", "text": "Disasters do not have a psychological footprint."}], "answer": "B"}, {"id": 475, "topic": "Crisis & Disaster Mental Health", "number": 5, "stem": "Disaster can cause:", "options": [{"letter": "A", "text": "Happiness only"}, {"letter": "B", "text": "Anxiety and stress"}, {"letter": "C", "text": "Better sleep"}, {"letter": "D", "text": "No emotional effect"}], "answer": "B"}, {"id": 476, "topic": "Crisis & Disaster Mental Health", "number": 6, "stem": "Anxiety after disasters may cause:", "options": [{"letter": "A", "text": "Good concentration"}, {"letter": "B", "text": "Sleep problems"}, {"letter": "C", "text": "Better memory"}, {"letter": "D", "text": "Increased appetite only"}], "answer": "B"}, {"id": 477, "topic": "Crisis & Disaster Mental Health", "number": 7, "stem": "The First reaction after a disaster is often:", "options": [{"letter": "A", "text": "Excitement"}, {"letter": "B", "text": "Shock"}, {"letter": "C", "text": "Happiness"}, {"letter": "D", "text": "Relaxation"}], "answer": "B"}, {"id": 478, "topic": "Crisis & Disaster Mental Health", "number": 8, "stem": "Which phase of stress reaction typically lasts from 1 to 6 weeks following a disaster?", "options": [{"letter": "A", "text": "Acute phase"}, {"letter": "B", "text": "Reaction phase"}, {"letter": "C", "text": "Repair phase"}, {"letter": "D", "text": "Reorientation phase"}], "answer": "B"}, {"id": 479, "topic": "Crisis & Disaster Mental Health", "number": 9, "stem": "During which phase of disaster stress reaction do individuals begin to take interest in everyday life and make plans for the future (lasting 1 to 6 months)?", "options": [{"letter": "A", "text": "Acute phase"}, {"letter": "B", "text": "Reaction phase"}, {"letter": "C", "text": "Repair phase"}, {"letter": "D", "text": "Emergency phase"}], "answer": "C"}, {"id": 480, "topic": "Crisis & Disaster Mental Health", "number": 10, "stem": "Grief after disasters may include:", "options": [{"letter": "A", "text": "Joy"}, {"letter": "B", "text": "Denial"}, {"letter": "C", "text": "Excitement"}, {"letter": "D", "text": "Confidence"}], "answer": "B"}, {"id": 481, "topic": "Crisis & Disaster Mental Health", "number": 11, "stem": "How many stages are there in the classic stages of grief?", "options": [{"letter": "A", "text": "3"}, {"letter": "B", "text": "4"}, {"letter": "C", "text": "5"}, {"letter": "D", "text": "7"}], "answer": "C"}, {"id": 482, "topic": "Crisis & Disaster Mental Health", "number": 12, "stem": "Loss of home after a disaster is a type of:", "options": [{"letter": "A", "text": "Physical loss"}, {"letter": "B", "text": "Educational success"}, {"letter": "C", "text": "Entertainment"}, {"letter": "D", "text": "Reward"}], "answer": "A"}, {"id": 483, "topic": "Crisis & Disaster Mental Health", "number": 13, "stem": "Disaster management aims to:", "options": [{"letter": "A", "text": "Increase damage"}, {"letter": "B", "text": "Reduce harm"}, {"letter": "C", "text": "Stop communication"}, {"letter": "D", "text": "Ignore victims"}], "answer": "B"}, {"id": 484, "topic": "Crisis & Disaster Mental Health", "number": 14, "stem": "What are the 3 basic action principles of Psychological First Aid (PFA)?", "options": [{"letter": "A", "text": "Read, Write, Speak"}, {"letter": "B", "text": "Look, Listen, Link"}, {"letter": "C", "text": "Diagnose, Treat, Cure"}, {"letter": "D", "text": "Assess, Evaluate, Discharge"}], "answer": "B"}, {"id": 485, "topic": "Crisis & Disaster Mental Health", "number": 15, "stem": "Psychological First Aid (PFA) is BEST described as:", "options": [{"letter": "A", "text": "Professional psychiatric therapy"}, {"letter": "B", "text": "Psychological debriefing"}, {"letter": "C", "text": "A set of skills to provide basic practical and emotional support"}], "answer": "C"}, {"id": 486, "topic": "Crisis & Disaster Mental Health", "number": 16, "stem": "When delivering Psychological First Aid, a helper should ALWAYS:", "options": [{"letter": "A", "text": "Force the person to talk about the traumatic event"}, {"letter": "B", "text": "Promise things that cannot be fulfilled"}, {"letter": "C", "text": "Respect privacy and maintain confidentiality"}, {"letter": "D", "text": "Charge a small fee for their services"}], "answer": "C"}, {"id": 487, "topic": "Crisis & Disaster Mental Health", "number": 17, "stem": "Which fundamental principle of \"Do No Harm\" focuses on treating people with respect and in accordance with cultural/social norms?", "options": [{"letter": "A", "text": "Safety"}, {"letter": "B", "text": "Dignity"}, {"letter": "C", "text": "Rights"}, {"letter": "D", "text": "Authority"}], "answer": "B"}, {"id": 488, "topic": "Crisis & Disaster Mental Health", "number": 18, "stem": "Which level of MHPSS implementation involves services provided directly by mental health care specialists (e.g., psychiatrists, psychologists)?", "options": [{"letter": "A", "text": "Level 1"}, {"letter": "B", "text": "Level 2"}, {"letter": "C", "text": "Level 3"}, {"letter": "D", "text": "Level 4"}], "answer": "D"}, {"id": 489, "topic": "Crisis & Disaster Mental Health", "number": 19, "stem": "Community support after disasters helps people to:", "options": [{"letter": "A", "text": "Recover emotionally"}, {"letter": "B", "text": "Forget food"}, {"letter": "C", "text": "Avoid communication"}, {"letter": "D", "text": "Increase fear"}], "answer": "A"}, {"id": 490, "topic": "Crisis & Disaster Mental Health", "number": 20, "stem": "What is defined as the ability to positively adapt and \"bounce back\" in the face of adversity?", "options": [{"letter": "A", "text": "Resilience"}, {"letter": "B", "text": "Regression"}, {"letter": "C", "text": "Conversion"}, {"letter": "D", "text": "Projection"}], "answer": "A"}, {"id": 491, "topic": "Suicide", "number": 1, "stem": "The term \"suicide\" is derived from which language?", "options": [{"letter": "A", "text": "Greek"}, {"letter": "B", "text": "Latin"}, {"letter": "C", "text": "French"}, {"letter": "D", "text": "German"}], "answer": "B"}, {"id": 492, "topic": "Suicide", "number": 2, "stem": "Which gender is likely to be dead by suicide?", "options": [{"letter": "A", "text": "Male"}, {"letter": "B", "text": "Female"}, {"letter": "C", "text": "Both"}, {"letter": "D", "text": "It depends on the country and culture"}], "answer": "A"}, {"id": 493, "topic": "Suicide", "number": 3, "stem": "Compared with women, men complete suicide at approximately:", "options": [{"letter": "A", "text": "Equal rate"}, {"letter": "B", "text": "Twice the rate"}, {"letter": "C", "text": "3–4 Times the rate"}, {"letter": "D", "text": "10 Times the rate"}], "answer": "C"}, {"id": 494, "topic": "Suicide", "number": 4, "stem": "Women attempt suicide about how many times more often than men?", "options": [{"letter": "A", "text": "Equal rate"}, {"letter": "B", "text": "Twice"}, {"letter": "C", "text": "Three Times"}, {"letter": "D", "text": "Five Times"}], "answer": "C"}, {"id": 495, "topic": "Suicide", "number": 5, "stem": "Which psychiatric disorder is most strongly associated with suicide risk?", "options": [{"letter": "A", "text": "Schizophrenia"}, {"letter": "B", "text": "Major depressive disorder"}, {"letter": "C", "text": "ADHD"}, {"letter": "D", "text": "Specific phobia"}], "answer": "B"}, {"id": 496, "topic": "Suicide", "number": 6, "stem": "Which psychiatric disorder is most commonly associated with completed suicide?", "options": [{"letter": "A", "text": "Schizophrenia"}, {"letter": "B", "text": "Major depression"}, {"letter": "C", "text": "Dementia"}, {"letter": "D", "text": "OCD"}], "answer": "B"}, {"id": 497, "topic": "Suicide", "number": 7, "stem": "Which mental disorder carries about a sevenfold increased suicide risk?", "options": [{"letter": "A", "text": "OCD"}, {"letter": "B", "text": "Panic disorder"}, {"letter": "C", "text": "Bipolar disorder"}, {"letter": "D", "text": "Dementia"}, {"letter": "E", "text": "ADHD"}], "answer": "B"}, {"id": 498, "topic": "Suicide", "number": 8, "stem ide", "number": 14, "stem": "A patient with suicidal thoughts should always be asked about:", "options": [{"letter": "A", "text": "Favorite hobbies"}, {"letter": "B", "text": "Dietary habits"}, {"letter": "C", "text": "Suicide plan and available means"}, {"letter": "D", "text": "Educational level"}, {"letter": "E", "text": "Blood group"}], "answer": "C"}, {"id": 505, "topic": "Suicide", "number": 15, "stem": "A patient expresses suicidal thoughts with a detailed plan and access to means. What is the most appropriate next step?", "options": [{"letter": "A", "text": "Reassure the patient and discharge home"}, {"letter": "B", "text": "Ignore the statement"}, {"letter": "C", "text": "Immediate psychiatric assessment and safety measures"}, {"letter": "D", "text": "Start vitamins only"}], "answer": "C"}, {"id": 506, "topic": "Suicide", "number": 16, "stem": "A patient who suddenly becomes calm after severe depression and suicidal ideation may:", "options": [{"letter": "A", "text": "Be fully recovered"}, {"letter": "B", "text": "Have decided to attempt suicide"}, {"letter": "C", "text": "Develop mania"}, {"letter": "D", "text": "No longer need follow-up"}], "answer": "B"}, {"id": 507, "topic": "Suicide", "number": 17, "stem": "Which method is more commonly used by men to complete suicide?", "options": [{"letter": "A", "text": "Drug overdose"}, {"letter": "B", "text": "Poisoning"}, {"letter": "C", "text": "Firearms and hanging"}, {"letter": "D", "text": "Wrist cutting"}, {"letter": "E", "text": "Drug injection"}], "answer": "C"}, {"id": 508, "topic": "Suicide", "number": 18, "stem": "A patient presents after an overdose attempt. What is the First priority in management?", "options": [{"letter": "A", "text": "Psychotherapy"}, {"letter": "B", "text": "Family counseling"}, {"letter": "C", "text": "Medical stabilization"}, {"letter": "D", "text": "Long-term rehabilitation"}], "answer": "C"}, {"id": 509, "topic": "Suicide", "number": 19, "stem": "Which of the following is an indication for hospital admission in a suicidal patient?", "options": [{"letter": "A", "text": "Good social support"}, {"letter": "B", "text": "No suicide plan"}, {"letter": "C", "text": "Poor judgment"}, {"letter": "D", "text": "No access to means"}, {"letter": "E", "text": "Ability to contract for safety"}], "answer": "C"}, {"id": 510, "topic": "Suicide", "number": 20, "stem": "A teenager engages in self-harm behavior without intent to die. This is best described as:", "options": [{"letter": "A", "text": "Completed suicide"}, {"letter": "B", "text": "Suicidal ideation"}, {"letter": "C", "text": "Non-suicidal self-injury"}, {"letter": "D", "text": "Euthanasia"}], "answer": "C"}, {"id": 511, "topic": "Substance Use Disorders (Part 1)", "number": 1, "stem": "A patient who cannot stop using a drug despite harmful consequences is most likely suffering from:", "options": [{"letter": "A", "text": "Phobia"}, {"letter": "B", "text": "Substance use disorder"}, {"letter": "C", "text": "Delirium"}, {"letter": "D", "text": "Dementia"}], "answer": "B"}, {"id": 512, "topic": "Substance Use Disorders (Part 1)", "number": 2, "stem": "DSM-5 classifies substance-related disorders as:", "options": [{"letter": "A", "text": "Substance abuse only"}, {"letter": "B", "text": "Substance dependence only"}, {"letter": "C", "text": "Substance use disorder"}, {"letter": "D", "text": "Drug addiction syndrome"}, {"letter": "E", "text": "Chemical dependence"}], "answer": "C"}, {"id": 513, "topic": "Substance Use Disorders (Part 1)", "number": 3, "stem": "A diagnosis of substance use disorder requires at least:", "options": [{"letter": "A", "text": "One symptom in 6 months"}, {"letter": "B", "text": "Two symptoms within 1 year"}, {"letter": "C", "text": "Three symptoms in 2 years"}, {"letter": "D", "text": "Four symptoms within 6 months"}, {"letter": "E", "text": "Five symptoms in 1 year"}], "answer": "B"}, {"id": 514, "topic": "Substance Use Disorders (Part 1)", "number": 4, "stem": "Which feature indicates physiological dependence?", "options": [{"letter": "A", "text": "Craving only"}, {"letter": "B", "text": "Social withdrawal only"}, {"letter": "C", "text": "Tolerance or withdrawal"}, {"letter": "D", "text": "Relationship problems only"}, {"letter": "E", "text": "Poor work performance"}], "answer": "C"}, {"id": 515, "topic": "Substance Use Disorders (Part 1)", "number": 5, "stem": "Which neurotransmitter pathway is mainly involved in addiction and reward?", "options": [{"letter": "A", "text": "Nigrostriatal dopamine pathway"}, {"letter": "B", "text": "Mesolimbic dopamine pathway"}, {"letter": "C", "text": "Corticospinal tract"}, {"letter": "D", "text": "Serotonergic raphe pathway"}], "answer": "B"}, {"id": 516, "topic": "Substance Use Disorders (Part 1)", "number": 6, "stem": "Alcohol withdrawal may commonly cause:", "options": [{"letter": "A", "text": "Bradycardia"}, {"letter": "B", "text": "Tremors"}, {"letter": "C", "text": "Pinpoint pupils"}, {"letter": "D", "text": "Hypersomnia"}], "answer": "B"}, {"id": 517, "topic": "Substance Use Disorders (Part 1)", "number": 7, "stem": "Which of the following substances is most associated with severe withdrawal that may become life- threatening?", "options": [{"letter": "A", "text": "Cannabis"}, {"letter": "B", "text": "Cocaine"}, {"letter": "C", "text": "Alcohol"}, {"letter": "D", "text": "LSD"}], "answer": "C"}, {"id": 518, "topic": "Substance Use Disorders (Part 1)", "number": 8, "stem": "Delirium tremens usually occurs when:", "options": [{"letter": "A", "text": "Alcohol intake suddenly increases"}, {"letter": "B", "text": "Blood alcohol level suddenly falls"}, {"letter": "C", "text": "Cannabis is combined with alcohol"}, {"letter": "D", "text": "Opioids are withdrawn"}, {"letter": "E", "text": "Cocaine is stopped abruptly"}], "answer": "B"}, {"id": 519, "topic": "Substance Use Disorders (Part 1)", "number": 9, "stem": "Alcohol enters the bloodstream mainly through the:", "options": [{"letter": "A", "text": "S // Detect questions whose stem text is a repeat of an earlier question in the bank.
// The first occurrence of a given question is left unmarked; every later repeat gets flagged.
const REPEATED_IDS = (function computeRepeats() {
  function normalizeStem(s) {
    return s
      .replace(/^\s*\d+[.\)\-]\s*/, "")
      .toLowerCase()
      .replace(/[^\w\s]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }
  const seen = new Set();
  const repeats = new Set();
  for (const q of QUESTIONS) {
    const key = normalizeStem(q.stem);
    if (seen.has(key)) repeats.add(q.id);
    else seen.add(key);
  }
  return repeats;
})();

function esc(s) {

/* ---------- Highlighter ---------- */
// state.highlights: { [compoundKey]: [{start, end, color}, ...] }  compoundKey e.g. "12__stem" or "12__opt_A"
function getHlRanges(key) { return state.highlights[key] || []; }
function setHlRanges(key, ranges) { state.highlights[key] = ranges; }

function addHighlight(key, start, end, color) {
  const existing = getHlRanges(key);
  const next = [];
  for (const r of existing) {
    if (r.end <= start || r.start >= end) { next.push(r); continue; } // no overlap, keep as-is
    if (r.start < start) next.push({ start: r.start, end: start, color: r.color });
    if (r.end > end) next.push({ start: end, end: r.end, color: r.color });
    // the overlapped middle portion is dropped; new range below replaces it
  }
  next.push({ start, end, color });
  next.sort((a, b) => a.start - b.start);
  setHlRanges(key, next);
}

function removeHighlight(key, start, end) {
  const existing = getHlRanges(key);
  setHlRanges(key, existing.filter(r => !(r.start === start && r.end === end)));
}

function renderHighlighted(text, key) {
  const ranges = getHlRanges(key);
  if (!ranges.length) return esc(text);
  let out = "";
  let pos = 0;
  for (const r of ranges) {
    if (r.start > pos) out += esc(text.slice(pos, r.start));
    out += `<mark class="hl hl-${r.color}" data-action="remove-highlight" data-hkey="${key}" data-start="${r.start}" data-end="${r.end}">${esc(text.slice(r.start, r.end))}</mark>`;
    pos = r.end;
  }
  if (pos < text.length) out += esc(text.slice(pos));
  return out;
}

/* ---------- Persistence (auto-save progress) ---------- */
// Uses Claude's artifact storage (window.storage) when available (works across devices/sessions
// for the signed-in user). When this file is opened directly in a regular browser — outside
// Claude, where window.storage doesn't exist — it falls back to the browser's own localStorage,
// so progress still survives closing the tab and reopening the file later on that same browser.
const STORAGE_KEY = "progress";
const LOCAL_STORAGE_KEY = "psychiatry_quiz_progress_v1";
let saveTimer = null;

function serializeProgress() {
  return JSON.stringify({
    answers: state.answers,
    submitted: Array.from(state.submitted),
    marked: Array.from(state.marked),
    markedCategory: state.markedCategory,
    categoryLabels: state.categoryLabels,
    highlights: state.highlights,
    currentId: state.currentId,
  });
}

async function saveProgress() {
  const payload = serializeProgress();
  if (window.storage) {
    try {
      await window.storage.set(STORAGE_KEY, payload);
      return;
    } catch (e) {
      console.error("Could not save quiz progress to window.storage:", e);
    }
  }
  // Fallback for standalone use outside Claude
  try {
    localStorage.setItem(LOCAL_STORAGE_KEY, payload);
  } catch (e) {
    console.error("Could not save quiz progress to localStorage:", e);
  }
}

// Debounce saves slightly so rapid actions don't spam the storage API
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveProgress, 300);
}

function applyProgressData(data) {
  if (data.answers) state.answers = data.answers;
  if (Array.isArray(data.submitted)) state.submitted = new Set(data.submitted);
  if (Array.isArray(data.marked)) state.marked = new Set(data.marked);
  if (data.markedCategory) state.markedCategory = data.markedCategory;
  if (data.categoryLabels) state.categoryLabels = data.categoryLabels;
  if (data.highlights) state.highlights = data.highlights;
  if (data.currentId && QUESTIONS.some(q => q.id === data.currentId)) {
    state.currentId = data.currentId;
    const q = QUESTIONS.find(x => x.id === data.currentId);
    state.expanded.add(q.topic);
  }
}

async function loadProgress() {
  if (window.storage) {
    try {
      const res = await window.storage.get(STORAGE_KEY);
      if (res && res.value) {
        applyProgressData(JSON.parse(res.value));
        return;
      }
    } catch (e) {
      // no saved progress yet in window.storage — fall through and check localStorage
    }
  }
  // Fallback for standalone use outside Claude
  try {
    const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
    if (raw) applyProgressData(JSON.parse(raw));
  } catch (e) {
    // no saved progress yet, or it was unreadable — start fresh
  }
}

async function clearProgress() {
  if (!confirm("Clear all saved progress? This will reset every answer, flag, and highlight. This can't be undone.")) {
    return;
  }
  state.answers = {};
  state.submitted = new Set();
  state.marked = new Set();
  state.markedCategory = {};
  state.highlights = {};
  state.currentId = QUESTIONS[0].id;
  state.expanded = new Set([QUESTIONS[0].topic]);
  state.view = "quiz";
  if (window.storage) {
    try { await window.storage.delete(STORAGE_KEY); } catch (e) { /* nothing to delete */ }
  }
  try { localStorage.removeItem(LOCAL_STORAGE_KEY); } catch (e) { /* ignore */ }
  render();
}

/* ---------- Actions ---------- */
function jump(id, opts = {}) {
  const { keepReview = false } = opts;
  if (!keepReview) state.reviewQueue = null;
  state.currentId = id;
  state.sidebarOpen = false;
  state.flagMenuOpen = false;
  const q = QUESTIONS.find(x => x.id === id);
  state.expanded.add(q.topic);
  scrollContentToTop = true;
  render();
  scheduleSave();
}
function toggleExpand(topic) {
  if (state.expanded.has(topic)) state.expanded.delete(topic); else state.expanded.add(topic);

}
function selectOption(letter) {
  if (state.submitted.has(state.currentId)) return;
  state.answers[state.currentId] = letter;
  render();
}
function submitAnswer() {
  if (!state.answers[state.currentId]) return;
  state.submitted.add(state.currentId);
  render();
  scheduleSave();
}
function toggleFlagMenu() {
  state.flagMenuOpen = !state.flagMenuOpen;

  state.flagMenuOpen = false;
